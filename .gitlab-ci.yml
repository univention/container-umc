---
include:
  - project: "univention/dev/nubus-for-k8s/common-ci"
    ref: "v1.72.0"
    file:
      - "defaults/stages.yaml"
      - "defaults/nubus-workflow.yaml"
      - "jobs/lint-pre-commit.yaml"
      - "jobs/lint-commit-messages.yaml"
      - "jobs/semantic-release-env.yaml"
      - "jobs/container-build-external-buildkit.yaml"
      - "jobs/package-and-publish-helm-charts-external.yaml"
      - "jobs/check-debian-updates.yaml"
      - "templates/sonarqube.yaml"
      - "templates/compose-test.yaml"

  # Copy the pinned upstream Traefik image into the registry that helm/umc-server pulls from.
  # Renovate bumps this pin together with proxy.image.tag (Traefik group in renovate.json5).
  - component: "$CI_SERVER_FQDN/univention/dev/tooling/ci-components/mirror-image@2.27.0"
    inputs:
      # Traefik Labs' own build. Docker republishes library/traefik tags under new digests, which the mirror refuses.
      source: "ghcr.io/traefik/traefik"
      tag: "v3.7.17"
      digest: "sha256:30ff62491aacdb862ceb8c9edcf2627da638d7deafdd4b6dab32fe34f8aa3e90"
      destination: "artifacts.software-univention.de/library/traefik"
  - component: "$CI_SERVER_FQDN/univention/dev/nubus-for-k8s/common-ci/vul-man@v1.72.0"

variables:
  RENOVATE_USER_ID: "1393"

lint-pre-commit:
  before_script:
    # Compose lint would fail without the referenced env files
    - helm repo add bitnami https://charts.bitnami.com/bitnami

.build-matrix: &build-matrix
  - IMAGE_NAME:
      - "umc-gateway"
      - "umc-server"
      - "testrunner"

container-build:
  parallel:
    matrix: *build-matrix

container-malware-scan:
  parallel:
    matrix: *build-matrix

container-sign-external:
  parallel:
    matrix: *build-matrix

push-image-external:
  parallel:
    matrix: *build-matrix

container-release-attestation:
  parallel:
    matrix: *build-matrix

sbom-upload:
  parallel:
    matrix:
      - IMAGE_NAME:
          - "umc-gateway"
          - "umc-server"

check-debian-updates:
  parallel:
    matrix: *build-matrix
  variables:
    TARGET_IMAGE: "${CI_REGISTRY_IMAGE}/${IMAGE_NAME}:latest"

package-helm-charts:
  before_script:
    - helm repo add bitnami https://charts.bitnami.com/bitnami

test-image-umc-server:
  extends: ".compose-test"
  stage: "test"
  variables:
    COMPOSE_TEST_SERVICES: "umc-server"
  script:
    # umc-server has no healthcheck, so `up --wait` returns once the container runs.
    - sleep 10
    - echo "Running tests inside of the image:"
    - docker compose exec umc-server univention-management-console-module --help
    - docker compose exec umc-server univention-management-console-server --help
    # Smoke test for the univention.udm package used by the self-service
    - docker compose exec umc-server python3 -c "from univention.udm import UDM, NoObject"
    - docker compose exec umc-server python3 -c "from univention.udm.plugins import Plugins; assert list(Plugins('univention.udm.modules'))"

    - echo "Running tests from outside the image:"
    - >-
      docker compose run --quiet-pull --rm test
      pytest tests/integration --umc-server-url=http://umc-server:8090

sonarqube:
  extends: .sonarqube
  needs: []

test-chart-umc-gateway:
  stage: test
  needs: []
  image: "gitregistry.knut.univention.de/univention/dev/nubus-for-k8s/common-helm/testrunner:0.29.24@sha256:1f34d54d23452475db4e92a43b669b8cb1817c4837b0003b2d897d47ed2f9d35"
  script:
    - helm dep build helm/umc-gateway
    - pytest -W error tests/chart/umc-gateway

test-chart-umc-server:
  stage: test
  needs: []
  image: "gitregistry.knut.univention.de/univention/dev/nubus-for-k8s/common-helm/testrunner:0.29.24@sha256:1f34d54d23452475db4e92a43b669b8cb1817c4837b0003b2d897d47ed2f9d35"
  script:
    # Required for the bundled charts
    - helm repo add bitnami https://charts.bitnami.com/bitnami
    - helm dep build helm/umc-server
    - pytest -W error tests/chart/umc-server

...
